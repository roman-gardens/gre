{{/* 

	If a list, return it
	If a string, split on commas
*/}}
{{- $isarray := isset . 0 -}}
{{- $list := slice -}}
{{- if $isarray -}}
	{{- $list = . -}}
{{- else if strings.Contains . ", " -}}
    {{- $list = split . ", " }}
{{- else -}}
	{{- $list = $list | append . -}}
{{- end -}}
{{- return $list -}}
